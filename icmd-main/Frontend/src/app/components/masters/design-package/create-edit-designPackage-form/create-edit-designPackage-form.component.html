<form class="form example-form" novalidate [formGroup]="form">

    <div class="row mt-5">
        <div class="col-6">
            <mat-form-field class="example-full-width">
                <mat-label>Design Package</mat-label>
                <input matInput formControlName="designPackage" autocomplete="false">
            </mat-form-field>
        </div>
        <div class="col-6">
            <mat-form-field class="example-full-width">
                <mat-label>Design Package Name</mat-label>
                <input matInput formControlName="designPackageName" autocomplete="false">
            </mat-form-field>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-6">
            <mat-form-field class="example-full-width">
                <mat-label>Design Vendor</mat-label>
                <input matInput formControlName="designVendor" autocomplete="false">
            </mat-form-field>
        </div>
        <div class="col-6">
            <mat-form-field class="example-full-width">
                <mat-label>Designed By</mat-label>
                <input matInput formControlName="designLead" autocomplete="false">
            </mat-form-field>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-6">
            <mat-form-field class="example-full-width">
                <mat-label>Validated By</mat-label>
                <input matInput formControlName="leadName" autocomplete="false">
            </mat-form-field>
        </div>
        <div class="col-6">
            <mat-form-field class="example-full-width">
                <mat-label>Package Status</mat-label>
                <input matInput formControlName="packageStatus" autocomplete="false">
            </mat-form-field>
        </div>
    </div>
   
</form>
