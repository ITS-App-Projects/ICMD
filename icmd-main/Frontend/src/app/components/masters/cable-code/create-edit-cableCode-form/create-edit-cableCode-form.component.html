<form class="form example-form" novalidate [formGroup]="form">

    <div class="row mt-5">
        <div class="col-12">
            <mat-form-field class="example-full-width">
                <mat-label>Cable Code Type</mat-label>
                <input matInput formControlName="cableSubType" autocomplete="false">
            </mat-form-field>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-12">
            <mat-form-field class="example-full-width">
                <mat-label>Description</mat-label>
                <input matInput formControlName="description" autocomplete="false">
            </mat-form-field>
        </div>
    </div>

</form>
